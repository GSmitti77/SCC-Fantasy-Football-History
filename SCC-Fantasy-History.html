<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCC Fantasy Football — History</title>
<meta name="description" content="The complete history of the SCC fantasy football league: champions, draft boards, team names and records since 2019.">
<style>
:root{
  /* SEC-inspired navy & blue */
  --bg:#081525; --panel:#0e2038; --panel2:#143053; --line:#22456e;
  --ink:#eef3fa; --muted:#9db6d4; --dim:#6d88ab;
  --navy:#0a1a2f; --blue:#2f7fd4; --blue-lt:#69aaf0; --blue-dk:#134a86;
  --gold:#f0c14b; --champ:#f0c14b; --silver:#c3d0de; --toilet:#a8756b;
  --accent:#2f7fd4; --accent2:#69aaf0;
  --radius:10px; --maxw:1180px;
  --qb:#3f8fd8; --rb:#d0a13a; --wr:#d9793f; --te:#3fa9a0; --k:#9b7fd4; --dst:#6f8fb8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent2)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
header.site{
  background:linear-gradient(150deg,#0a1c33 0%,#143964 55%,#0a1e38 100%);
  border-bottom:1px solid var(--line);
}
header.site .wrap{padding-top:30px;padding-bottom:20px}
h1.title{margin:0;font-size:34px;letter-spacing:-.5px;font-weight:750}
h1.title span{color:var(--gold)}
p.sub{margin:6px 0 0;color:var(--muted);font-size:15px}

/* ---------- nav ---------- */
nav.tabs{background:#0a1a2e;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;padding-top:8px;padding-bottom:0;align-items:flex-end}
nav.tabs button{
  background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
  font:inherit;font-size:14px;font-weight:600;padding:10px 13px;cursor:pointer;white-space:nowrap;border-radius:6px 6px 0 0;
}
nav.tabs button:hover{color:var(--ink);background:#12294a}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--blue-lt);background:#12294a}
nav.tabs .sep{width:1px;background:var(--line);align-self:stretch;margin:8px 8px 8px}
nav.tabs .eralabel{
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  padding:0 6px 14px;align-self:flex-end;font-weight:700;
}

/* ---------- layout ---------- */
main{padding:26px 0 70px}
section.view{display:none}
section.view.on{display:block}
h2{font-size:22px;margin:34px 0 12px;letter-spacing:-.2px}
h2:first-child{margin-top:0}
h3{font-size:15px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.grid{display:grid;gap:14px}
.note{color:var(--dim);font-size:13px;margin:10px 0 0}
.empty{color:var(--dim);font-size:14px;padding:22px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius);background:#0b1c31}
.empty code{background:#173352;padding:2px 6px;border-radius:4px;color:var(--muted);font-size:12px}

/* ---------- season hero ---------- */
.hero{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:8px}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--muted);font-size:14px;align-items:center}
.hero .meta b{color:var(--ink);font-weight:600}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:#0b1c31}
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.podium .card{display:flex;gap:14px;align-items:center}
.podium .ico{font-size:30px;line-height:1}
.podium .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700}
.podium .team{font-size:19px;font-weight:700;margin:2px 0 1px}
.podium .own{font-size:13px;color:var(--muted)}
.podium.champ .team{color:var(--champ)}
.podium .card.champ{border-color:#5c4c1f;background:linear-gradient(150deg,#251f10,#0e2038)}
.podium .card.toilet{border-color:#4a302b;background:linear-gradient(150deg,#231613,#0e2038)}
.podium .card.toilet .team{color:var(--toilet)}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:14px}
th{
  text-align:left;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
  font-weight:700;padding:0 10px 9px;border-bottom:1px solid var(--line);white-space:nowrap;
}
td{padding:10px;border-bottom:1px solid #16304f;vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#12294a}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tname{font-weight:650}
.oname{color:var(--muted);font-size:13px}
.table-scroll{overflow-x:auto}
.rank{color:var(--dim);font-variant-numeric:tabular-nums;width:1%}
.trophy{color:var(--gold)}
.poop{color:var(--toilet)}

/* ---------- draft board ---------- */
.board-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
table.board{font-size:13px;min-width:100%}
table.board th{
  padding:12px 10px;background:var(--panel2);position:sticky;top:0;
  border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);min-width:150px;
}
table.board th.rnd{min-width:44px;text-align:center;color:var(--dim)}
table.board td{padding:7px 10px;border-bottom:1px solid #16304f;border-right:1px solid #12283f}
table.board td:last-child{border-right:0}
table.board td.rnd{text-align:center;color:var(--dim);font-weight:700;background:var(--panel2);font-variant-numeric:tabular-nums}
table.board tr:hover td:not(.rnd){background:#12294a}
.pl{font-weight:600;display:block;line-height:1.3}
.pmeta{font-size:11px;color:var(--dim)}
.pos{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.05em;padding:1px 5px;border-radius:3px;
  color:#07131f;margin-right:5px;vertical-align:1px}
.pos.QB{background:var(--qb)}.pos.RB{background:var(--rb)}.pos.WR{background:var(--wr)}
.pos.TE{background:var(--te)}.pos.K{background:var(--k)}.pos[class*="D/ST"],.pos.DST{background:var(--dst)}

/* ---------- owner cards ---------- */
.owners{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.owner h4{margin:0;font-size:18px}
.owner .tallies{display:flex;gap:14px;margin:8px 0 14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.owner .tallies b{color:var(--ink)}
.hist{list-style:none;margin:0;padding:0;font-size:13.5px}
.hist li{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid #16304f}
.hist li:last-child{border-bottom:0}
.hist .yr{color:var(--dim);font-variant-numeric:tabular-nums;width:38px;flex:none;font-weight:600}
.hist .nm{flex:1}
.hist .mark{flex:none}

/* ---------- photos ---------- */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.gallery figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.gallery img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover;background:#143053;cursor:zoom-in}
.gallery figcaption{padding:8px 10px;font-size:12.5px;color:var(--muted)}
#lightbox{position:fixed;inset:0;background:rgba(5,14,26,.95);display:none;align-items:center;justify-content:center;z-index:100;padding:30px;cursor:zoom-out}
#lightbox.on{display:flex}
#lightbox img{max-width:100%;max-height:100%;border-radius:8px}

footer{border-top:1px solid var(--line);color:var(--dim);font-size:13px;padding:22px 0 40px}
@media (max-width:640px){
  h1.title{font-size:26px}
  .wrap{padding:0 14px}
  .owners{grid-template-columns:1fr}
}

/* playoff cutoff divider in season standings */
tr.cutoff td{border-top:2px solid var(--line);position:relative}
tr.cutoff td:first-child::before{
  content:"playoff cutoff";position:absolute;top:-9px;left:10px;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);background:var(--panel);padding:0 6px;white-space:nowrap;
}

/* ---------- brand / logo ---------- */
header.site .brand{display:flex;align-items:center;gap:20px}
header.site .logo{
  width:78px;height:78px;flex:none;object-fit:contain;
  filter:drop-shadow(0 2px 10px rgba(0,0,0,.45));
}
h1.title span{color:var(--blue-lt)}

/* watermark of the crest behind each season header */
.hero{position:relative}
.hero::after{
  content:"";position:absolute;right:-6px;top:-14px;width:120px;height:120px;
  background:url(assets/logo-white.png) center/contain no-repeat;opacity:.045;pointer-events:none;
}
.medal{color:var(--silver)}
.podium .card.silver{border-color:#3d5878;background:linear-gradient(150deg,#152a41,#0e2038)}
.podium .card.silver .team{color:var(--silver)}

/* manager cards */
.mgr .crown{font-size:12px;color:var(--dim);margin-left:6px;font-weight:600}
.statline{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.stat{
  display:flex;flex-direction:column;align-items:center;min-width:52px;padding:6px 9px;
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;line-height:1.15;
}
.stat b{font-size:16px;font-variant-numeric:tabular-nums}
.stat span{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-top:2px}
.stat.gold b{color:var(--gold)} .stat.silv b{color:var(--silver)} .stat.bad b{color:var(--toilet)}

/* ---------- video in galleries ---------- */
.gallery figure.vid .thumb{position:relative;cursor:pointer;background:#143053}
.gallery figure.vid video{
  width:100%;display:block;aspect-ratio:4/3;object-fit:cover;background:#143053;
}
.gallery figure.vid .play{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:26px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.7);
  background:radial-gradient(circle at center, rgba(8,21,37,.35) 0%, rgba(8,21,37,.06) 60%);
  transition:background .15s ease;
}
.gallery figure.vid .thumb:hover .play{background:radial-gradient(circle at center, rgba(8,21,37,.5) 0%, rgba(8,21,37,.15) 60%)}
#lightbox video{max-width:100%;max-height:100%;border-radius:8px;background:#000;cursor:default}

/* ---------- all-photos tab ---------- */
.yearjump{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.yearjump a{
  display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:650;text-decoration:none;
  background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:5px 13px;color:var(--muted);
}
.yearjump a:hover{background:#12294a;color:var(--ink);border-color:var(--blue)}
.yearjump a span{
  font-size:11px;font-weight:700;background:var(--blue-dk);color:#fff;
  border-radius:99px;padding:1px 7px;min-width:20px;text-align:center;
}
.yearhead{
  display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  margin:30px 0 12px;border-bottom:1px solid var(--line);padding-bottom:8px;
}
.yearhead h3{margin:0;font-size:19px;color:var(--ink);text-transform:none;letter-spacing:-.2px}
.yearhead a{text-decoration:none;font-size:13px;white-space:nowrap}
.yearhead a:hover{color:var(--blue-lt)}

</style>

<script>
/* SCC Fantasy History — data-driven single-page site */
(function () {
  "use strict";

  var L = null, PHOTOS = {}, DRAFTS = {}, view = "overview";

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var el = function (t, cls, html) {
    var n = document.createElement(t);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  };
  var owners = function (a) { return (a || []).join(" & "); };
  var posClass = function (p) { return p === "D/ST" ? "DST" : (p || "").replace(/[^A-Z]/g, ""); };

  // In the standalone build the JSON is embedded as window.SCC_DATA so the page
  // works from a plain file:// double-click. Otherwise fetch it normally.
  function getJSON(url) {
    if (window.SCC_DATA && Object.prototype.hasOwnProperty.call(window.SCC_DATA, url)) {
      return Promise.resolve(window.SCC_DATA[url]);
    }
    return fetch(url, { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error(url + " -> " + r.status);
      return r.json();
    });
  }

  /* ---------------- boot ---------------- */
  getJSON("data/league.json")
    .then(function (league) {
      L = league;
      document.title = L.siteTitle + " — History";
      $("#siteTitle").innerHTML = esc(L.siteTitle).replace(/^SCC/, "<span>SCC</span>");
      $("#siteSub").textContent = L.subtitle || "";
      return getJSON("data/photos.json").catch(function () { return {}; });
    })
    .then(function (p) {
      PHOTOS = p || {};
      var years = L.seasons.map(function (s) { return s.year; });
      return Promise.all(
        years.map(function (y) {
          return getJSON("data/draft" + y + ".json")
            .then(function (d) { DRAFTS[y] = d; })
            .catch(function () { DRAFTS[y] = null; });
        })
      );
    })
    .then(function () {
      buildNav();
      renderAll();
      route();
      window.addEventListener("hashchange", route);
    })
    .catch(function (e) {
      $("#views").innerHTML =
        '<div class="empty">Could not load league data.<br><small>' +
        esc(e.message) +
        "</small><br><br>If you opened this file directly from your computer, run it through a local server " +
        "(<code>python3 -m http.server</code>) or view it on GitHub Pages — browsers block file:// data loading.</div>";
    });

  /* ---------------- nav ---------------- */
  function buildNav() {
    var nav = $("#tabs");
    nav.appendChild(tabBtn("overview", "Overview"));
    nav.appendChild(tabBtn("owners", "Managers"));
    nav.appendChild(tabBtn("photos", "Photos"));

    ["pre", "scc"].forEach(function (key) {
      var seasons = L.seasons.filter(function (s) { return s.era === key; })
        .sort(function (a, b) { return a.year - b.year; });
      if (!seasons.length) return;
      nav.appendChild(el("span", "sep"));
      nav.appendChild(el("span", "eralabel", esc(L.eras[key].label)));
      seasons.forEach(function (s) { nav.appendChild(tabBtn("y" + s.year, String(s.year))); });
    });
  }
  function tabBtn(id, label) {
    var b = el("button", "", esc(label));
    b.dataset.view = id;
    b.onclick = function () { location.hash = id; };
    return b;
  }
  function route() {
    var want = (location.hash || "#overview").slice(1);
    if (!$('#views > [data-view="' + CSS.escape(want) + '"]')) want = "overview";
    view = want;
    Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (b) {
      b.classList.toggle("on", b.dataset.view === want);
    });
    Array.prototype.forEach.call(document.querySelectorAll("#views > section"), function (s) {
      s.classList.toggle("on", s.dataset.view === want);
    });
    window.scrollTo(0, 0);
  }

  /* ---------------- derived data ---------------- */
  /* Everything is keyed on the PERSON, not on the ESPN team slot, so a slot that
     changed hands credits each title to whoever actually won it. Co-managed teams
     credit both people with that team's season. */
  function managerIndex() {
    var idx = {};
    L.seasons.slice().sort(function (a, b) { return a.year - b.year; }).forEach(function (s) {
      (s.teams || []).forEach(function (t) {
        (t.owners || []).forEach(function (o) {
          if (!idx[o]) idx[o] = {
            name: o, seasons: [], titles: 0, seconds: 0, lasts: 0,
            w: 0, l: 0, t: 0, pf: 0, pa: 0, tracked: 0
          };
          var m = idx[o];
          var champ = !!(s.champion && s.champion.team === t.name);
          var second = !!(s.runnerUp && s.runnerUp.team === t.name);
          var last = !!(s.lastPlace && s.lastPlace.team === t.name);
          if (champ) m.titles++;
          if (second) m.seconds++;
          if (last) m.lasts++;
          if (t.record) {
            m.w += t.record.wins || 0; m.l += t.record.losses || 0; m.t += t.record.ties || 0;
            m.pf += t.record.pointsFor || 0; m.pa += t.record.pointsAgainst || 0; m.tracked++;
          }
          m.seasons.push({
            year: s.year, era: s.era, team: t.name, champ: champ, second: second, last: last,
            co: (t.owners || []).filter(function (x) { return x !== o; }),
            record: t.record || null, finalRank: t.finalRank || null
          });
        });
      });
    });
    return idx;
  }

  function allTimeRows() {
    var idx = managerIndex();
    return Object.keys(idx).map(function (k) {
      var m = idx[k];
      var g = m.w + m.l + m.t;
      m.games = g;
      m.pct = g ? m.w / g : null;
      m.first = m.seasons[0].year;
      m.latest = m.seasons[m.seasons.length - 1].year;
      m.best = Math.min.apply(null, m.seasons.map(function (x) { return x.finalRank || 99; }));
      return m;
    }).sort(function (a, b) {
      return b.titles - a.titles || b.seconds - a.seconds || (b.pct || -1) - (a.pct || -1) ||
        b.seasons.length - a.seasons.length || a.name.localeCompare(b.name);
    });
  }

  /* ---------------- render ---------------- */
  function renderAll() {
    var root = $("#views");
    root.innerHTML = "";
    root.appendChild(viewOverview());
    root.appendChild(viewManagers());
    root.appendChild(viewPhotos());
    L.seasons.slice().sort(function (a, b) { return a.year - b.year; })
      .forEach(function (s) { root.appendChild(viewSeason(s)); });
  }
  function section(id) {
    var s = el("section", "view");
    s.dataset.view = id;
    return s;
  }

  /* ----- Overview ----- */
  function viewOverview() {
    var v = section("overview");
    var seasons = L.seasons.slice().sort(function (a, b) { return b.year - a.year; });
    var rows = allTimeRows();

    /* trophy case */
    var champs = rows.filter(function (r) { return r.titles; });
    v.appendChild(el("h2", "", "Trophy Case"));
    var tc = el("div", "podium");
    [["🏆", "Championships", "titles", "champ"],
     ["🥈", "Runner-up", "seconds", "silver"],
     ["💩", "Last place", "lasts", "toilet"]].forEach(function (spec) {
      var list = rows.filter(function (r) { return r[spec[2]]; })
        .sort(function (a, b) { return b[spec[2]] - a[spec[2]] || a.name.localeCompare(b.name); });
      var top = list.length ? list[0][spec[2]] : 0;
      var leaders = list.filter(function (r) { return r[spec[2]] === top; });
      var c = el("div", "card " + spec[3]);
      c.innerHTML = "<div class='ico'>" + spec[0] + "</div><div><div class='lbl'>Most " + spec[1] + "</div>" +
        "<div class='team'>" + (leaders.length ? esc(leaders.map(function (r) { return r.name; }).join(", ")) : "—") + "</div>" +
        "<div class='own'>" + (top ? top + "×" : "none yet") + "</div></div>";
      tc.appendChild(c);
    });
    v.appendChild(tc);

    v.appendChild(el("h2", "", "Season by Season"));
    var tw = el("div", "card table-scroll");
    var t = el("table");
    t.innerHTML =
      "<thead><tr><th>Season</th><th>League name</th><th class='num'>Teams</th>" +
      "<th>🏆 Champion</th><th>🥈 Runner-up</th><th>💩 Last place</th></tr></thead>";
    var tb = el("tbody");
    seasons.forEach(function (s) {
      var tr = el("tr");
      tr.innerHTML =
        "<td><a href='#y" + s.year + "'><b>" + s.year + "</b></a> " +
        "<span class='pill'>" + esc(L.eras[s.era].label) + "</span></td>" +
        "<td class='oname'>" + esc(s.leagueName || "—") + "</td>" +
        "<td class='num'>" + (s.teamCount || (s.teams || []).length) + "</td>" +
        "<td>" + champCell(s.champion, "trophy") + "</td>" +
        "<td>" + champCell(s.runnerUp, "medal") + "</td>" +
        "<td>" + champCell(s.lastPlace, "poop") + "</td>";
      tb.appendChild(tr);
    });
    t.appendChild(tb); tw.appendChild(t); v.appendChild(tw);
    v.appendChild(el("p", "note",
      "Full manager records, win totals and every team name are on the " +
      "<a href='#owners'>Managers</a> tab."));
    return v;
  }

  function champCell(c, cls) {
    if (!c) return "<span style='color:var(--dim)'>—</span>";
    return "<span class='tname " + cls + "'>" + esc(c.team) + "</span><br>" +
      "<span class='oname'>" + esc(owners(c.owners)) + "</span>";
  }
  function fmt(n) {
    return (Math.round(n * 10) / 10).toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  }

  /* ----- Managers ----- */
  function viewManagers() {
    var v = section("owners");
    var rows = allTimeRows();
    var anyRecords = rows.some(function (r) { return r.tracked > 0; });

    v.appendChild(el("h2", "", "All-Time Manager Records"));
    var tw = el("div", "card table-scroll");
    var t = el("table");
    t.innerHTML =
      "<thead><tr><th class='rank'>#</th><th>Manager</th><th class='num'>Seasons</th>" +
      "<th class='num'>🏆</th><th class='num'>🥈</th><th class='num'>💩</th>" +
      (anyRecords ? "<th class='num'>W</th><th class='num'>L</th><th class='num'>Win%</th>" +
        "<th class='num'>PF</th><th class='num'>PA</th><th class='num'>Diff</th>" : "") +
      "<th class='num'>Best</th></tr></thead>";
    var tb = el("tbody");
    rows.forEach(function (r, i) {
      var tr = el("tr");
      var h = "<td class='rank'>" + (i + 1) + "</td>" +
        "<td class='tname'><a href='#mgr-" + slug(r.name) + "'>" + esc(r.name) + "</a>" +
        "<br><span class='oname'>" + r.first + "–" + r.latest + "</span></td>" +
        "<td class='num'>" + r.seasons.length + "</td>" +
        "<td class='num trophy'>" + (r.titles || "—") + "</td>" +
        "<td class='num medal'>" + (r.seconds || "—") + "</td>" +
        "<td class='num poop'>" + (r.lasts || "—") + "</td>";
      if (anyRecords) {
        h += r.tracked
          ? "<td class='num'>" + r.w + "</td><td class='num'>" + r.l + "</td>" +
            "<td class='num'>" + (r.pct == null ? "—" : r.pct.toFixed(3).replace(/^0/, "")) + "</td>" +
            "<td class='num'>" + fmt(r.pf) + "</td><td class='num'>" + fmt(r.pa) + "</td>" +
            "<td class='num'>" + (r.pf - r.pa >= 0 ? "+" : "") + fmt(r.pf - r.pa) + "</td>"
          : "<td class='num' colspan='6' style='color:var(--dim)'>not tracked</td>";
      }
      h += "<td class='num'>" + (r.best < 99 ? r.best : "—") + "</td>";
      tr.innerHTML = h;
      tb.appendChild(tr);
    });
    t.appendChild(tb); tw.appendChild(t); v.appendChild(tw);
    v.appendChild(el("p", "note",
      "Win-loss records and points cover 2022–present only — the Pre-SCC seasons recorded " +
      "finishes but not weekly results. Trophies and last-place finishes cover all seven seasons. " +
      "A co-managed team counts for both managers, so the W and L columns don't sum to the league total."));

    v.appendChild(el("h2", "", "Team Names by Manager"));
    v.appendChild(el("p", "note",
      "Almost nobody keeps a team name two years running, so this is the thread that ties it together."));
    var grid = el("div", "owners");
    rows.forEach(function (r) {
      var c = el("div", "card owner mgr");
      c.id = "mgr-" + slug(r.name);
      var stats =
        statTile(r.seasons.length, "Seasons", "") +
        statTile(r.titles, "Titles", "gold") +
        statTile(r.seconds, "2nd", "silv") +
        statTile(r.lasts, "Last", "bad") +
        (r.tracked ? statTile(r.w + "-" + r.l, "Record", "") : "");
      var lis = r.seasons.map(function (y) {
        var rec = y.record ? y.record.wins + "-" + y.record.losses + (y.record.ties ? "-" + y.record.ties : "") : "";
        return "<li><span class='yr'>" + y.year + "</span>" +
          "<span class='nm'>" + esc(y.team) +
          (y.co.length ? "<br><span class='oname'>with " + esc(owners(y.co)) + "</span>" : "") + "</span>" +
          "<span class='oname' style='width:50px;text-align:right'>" + rec + "</span>" +
          "<span class='mark'>" + (y.champ ? "🏆" : "") + (y.second ? "🥈" : "") + (y.last ? "💩" : "") + "</span></li>";
      }).join("");
      c.innerHTML = "<h4>" + esc(r.name) + "</h4>" +
        "<div class='statline'>" + stats + "</div>" +
        "<ul class='hist'>" + lis + "</ul>";
      grid.appendChild(c);
    });
    v.appendChild(grid);
    return v;
  }

  function statTile(val, label, cls) {
    return "<div class='stat " + (cls || "") + "'><b>" + esc(val || (val === 0 ? "0" : "—")) +
      "</b><span>" + esc(label) + "</span></div>";
  }
  function slug(n) { return String(n).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }

  /* ----- All photos, grouped by season ----- */
  function mediaCounts() {
    var photos = 0, videos = 0, years = [];
    Object.keys(PHOTOS).forEach(function (k) {
      if (!/^\d{4}$/.test(k)) return;                 // skip _readme etc.
      var list = PHOTOS[k] || [];
      if (!list.length) return;
      years.push(k);
      list.forEach(function (m) { isVideo(m.file) ? videos++ : photos++; });
    });
    years.sort().reverse();
    return { photos: photos, videos: videos, years: years };
  }

  function viewPhotos() {
    var v = section("photos");
    var c = mediaCounts();

    v.appendChild(el("h2", "", "Photos &amp; Videos"));
    if (!c.years.length) {
      v.appendChild(el("div", "empty",
        "No photos or videos yet.<br><br>" +
        "Open <a href='add-photos.html'>Add Photos &amp; Videos</a> and drag some in."));
      return v;
    }

    var bits = [];
    if (c.photos) bits.push("<b>" + c.photos + "</b> photo" + (c.photos === 1 ? "" : "s"));
    if (c.videos) bits.push("<b>" + c.videos + "</b> video" + (c.videos === 1 ? "" : "s"));
    v.appendChild(el("p", "note",
      bits.join(" and ") + " across " + c.years.length + " season" +
      (c.years.length === 1 ? "" : "s") + ". Newest first."));

    // quick jump chips
    var jump = el("div", "yearjump");
    c.years.forEach(function (y) {
      var a = el("a", "", y + " <span>" + (PHOTOS[y] || []).length + "</span>");
      a.href = "#photos-" + y;
      a.onclick = function (e) {
        e.preventDefault();
        var t = document.getElementById("photos-" + y);
        if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
      };
      jump.appendChild(a);
    });
    v.appendChild(jump);

    c.years.forEach(function (y) {
      var head = el("div", "yearhead");
      head.id = "photos-" + y;
      head.innerHTML = "<h3>" + y + "</h3>" +
        "<a class='oname' href='#y" + y + "'>Go to the " + y + " season →</a>";
      v.appendChild(head);
      v.appendChild(gallery(y));
    });
    return v;
  }

  /* ----- Season ----- */
  function viewSeason(s) {
    var v = section("y" + s.year);

    var hero = el("div", "hero");
    var h = el("div");
    h.innerHTML = "<h2 style='margin:0'>" + s.year + " &nbsp;<span class='pill'>" +
      esc(L.eras[s.era].label) + "</span>" +
      (s.seasonLabel ? " <span class='pill'>" + esc(s.seasonLabel) + "</span>" : "") + "</h2>";
    hero.appendChild(h);
    var meta = el("div", "meta");
    meta.innerHTML =
      "League name: <b>" + esc(s.leagueName || "—") + "</b>" +
      "<span>Teams: <b>" + (s.teamCount || (s.teams || []).length) + "</b></span>" +
      (s.draftSource ? "<span>Draft source: <b>" + esc(s.draftSource) + "</b></span>" : "");
    hero.appendChild(meta);
    v.appendChild(hero);

    var pod = el("div", "podium");
    pod.appendChild(podCard("champ", "🏆", "Champion", s.champion));
    pod.appendChild(podCard("silver", "🥈", "Runner-up", s.runnerUp));
    pod.appendChild(podCard("toilet", "💩", "Last place", s.lastPlace));
    v.appendChild(pod);

    /* teams */
    v.appendChild(el("h2", "", "Teams &amp; Managers"));
    var tw = el("div", "card table-scroll");
    var hasRec = (s.teams || []).some(function (t) { return t.record; });
    var t = el("table");
    t.innerHTML = "<thead><tr><th class='rank'>" + (hasRec ? "Fin" : "#") + "</th><th>Team</th><th>Manager(s)</th>" +
      (hasRec ? "<th class='num'>W-L</th><th class='num'>PF</th><th class='num'>PA</th>" +
                "<th class='num'>Diff</th><th class='num'>Seed</th>" : "") +
      "</tr></thead>";
    var tb = el("tbody");
    (s.teams || []).forEach(function (tm, i) {
      var tr = el("tr");
      if (hasRec && s.playoffTeamCount && (i + 1) === s.playoffTeamCount + 1) tr.className = "cutoff";
      var mark = (s.champion && s.champion.team === tm.name ? " <span class='trophy'>🏆</span>" : "") +
        (s.runnerUp && s.runnerUp.team === tm.name ? " <span class='medal'>🥈</span>" : "") +
        (s.lastPlace && s.lastPlace.team === tm.name ? " <span class='poop'>💩</span>" : "");
      var html = "<td class='rank'>" + (tm.finalRank || i + 1) + "</td>" +
        "<td class='tname'>" + esc(tm.name) + mark +
        (tm.draftedAs ? "<br><span class='oname'>drafted as “" + esc(tm.draftedAs) + "”</span>" : "") + "</td>" +
        "<td class='oname'>" + esc(owners(tm.owners)) + "</td>";
      if (hasRec) {
        var r = tm.record;
        html += r
          ? "<td class='num'>" + r.wins + "-" + r.losses + (r.ties ? "-" + r.ties : "") + "</td>" +
            "<td class='num'>" + fmt(r.pointsFor) + "</td><td class='num'>" + fmt(r.pointsAgainst) + "</td>" +
            "<td class='num'>" + (r.pointsFor - r.pointsAgainst >= 0 ? "+" : "") + fmt(r.pointsFor - r.pointsAgainst) + "</td>" +
            "<td class='num'>" + (tm.playoffSeed || "—") +
              (tm.madePlayoffs ? "" : " <span class='oname' title='missed the playoffs'>·</span>") + "</td>"
          : "<td class='num' colspan='5' style='color:var(--dim)'>—</td>";
      }
      tr.innerHTML = html;
      tb.appendChild(tr);
    });
    t.appendChild(tb); tw.appendChild(t); v.appendChild(tw);
    if (s.standingsNote) v.appendChild(el("p", "note", esc(s.standingsNote)));

    /* draft */
    v.appendChild(el("h2", "", "Draft Board"));
    var picks = DRAFTS[s.year];
    if (!picks || !picks.length) {
      v.appendChild(el("div", "empty", "No draft data recorded for " + s.year + "."));
    } else {
      v.appendChild(draftBoard(s, picks));
      if (s.draftNote) v.appendChild(el("p", "note", esc(s.draftNote)));
    }

    /* photos */
    v.appendChild(el("h2", "", "Draft Photos"));
    v.appendChild(gallery(s.year));

    return v;
  }

  function podCard(kind, ico, label, data) {
    var c = el("div", "card " + kind);
    c.innerHTML = "<div class='ico'>" + ico + "</div><div><div class='lbl'>" + label + "</div>" +
      "<div class='team'>" + (data ? esc(data.team) : "—") + "</div>" +
      "<div class='own'>" + (data ? esc(owners(data.owners)) : "not recorded") + "</div></div>";
    var w = el("div"); w.appendChild(c);
    return c;
  }

  function draftBoard(s, picks) {
    // team column order: prefer explicit draftSlot / boardColumn, else order of first appearance
    var teams = (s.teams || []).slice();
    var ordered = teams.filter(function (t) { return t.draftSlot || t.boardColumn; })
      .sort(function (a, b) { return (a.draftSlot || a.boardColumn) - (b.draftSlot || b.boardColumn); })
      .map(function (t) { return t.name; });
    if (!ordered.length) {
      var seen = [];
      picks.forEach(function (p) { if (seen.indexOf(p.team) < 0) seen.push(p.team); });
      ordered = seen;
    }
    // pick lookup by team+round
    var by = {};
    picks.forEach(function (p) { by[p.team + "|" + p.round] = p; });
    var rounds = Math.max.apply(null, picks.map(function (p) { return p.round; }));

    var wrap = el("div", "board-scroll");
    var t = el("table", "board");
    var head = "<tr><th class='rnd'>Rd</th>" + ordered.map(function (n) {
      return "<th>" + esc(n) + "</th>";
    }).join("") + "</tr>";
    t.innerHTML = "<thead>" + head + "</thead>";
    var tb = el("tbody");
    for (var r = 1; r <= rounds; r++) {
      var tr = el("tr");
      var cells = "<td class='rnd'>" + r + "</td>";
      ordered.forEach(function (n) {
        var p = by[n + "|" + r];
        if (!p) { cells += "<td></td>"; return; }
        var meta = [];
        if (p.overall) meta.push("#" + p.overall);
        if (p.nfl) meta.push(p.nfl);
        cells += "<td><span class='pl'>" +
          (p.pos ? "<span class='pos " + posClass(p.pos) + "'>" + esc(p.pos) + "</span>" : "") +
          esc(p.player) + "</span>" +
          (meta.length ? "<span class='pmeta'>" + esc(meta.join(" · ")) + "</span>" : "") + "</td>";
      });
      tr.innerHTML = cells;
      tb.appendChild(tr);
    }
    t.appendChild(tb); wrap.appendChild(t);
    return wrap;
  }

  /* ----- photos & video ----- */
  var VIDEO_EXT = /\.(mp4|m4v|mov|webm|ogv)$/i;
  function isVideo(f) { return VIDEO_EXT.test(String(f || "")); }

  function gallery(year) {
    var list = PHOTOS[String(year)] || [];
    if (!list.length) {
      return el("div", "empty",
        "Nothing here yet for " + year + ".<br><br>" +
        "Open <a href='add-photos.html'>Add Photos &amp; Videos</a> and drag files in — " +
        "it files them and updates the gallery for you.");
    }
    var g = el("div", "gallery");
    list.forEach(function (p) {
      var src = "photos/" + year + "/" + p.file;
      var alt = p.caption || (year + " draft");
      var f = el("figure");
      if (isVideo(p.file)) {
        f.className = "vid";
        // poster is optional; without it the browser shows the first frame once metadata loads
        f.innerHTML =
          "<div class='thumb'><video preload='metadata' muted playsinline" +
          (p.poster ? " poster='" + esc("photos/" + year + "/" + p.poster) + "'" : "") +
          "><source src='" + esc(src) + "'>Your browser can't play this video.</video>" +
          "<span class='play' aria-hidden='true'>▶</span></div>" +
          (p.caption ? "<figcaption>" + esc(p.caption) + "</figcaption>" : "");
        f.querySelector(".thumb").onclick = function () { lightbox(src, true); };
      } else {
        f.innerHTML = "<img loading='lazy' src='" + esc(src) + "' alt='" + esc(alt) + "'>" +
          (p.caption ? "<figcaption>" + esc(p.caption) + "</figcaption>" : "");
        f.querySelector("img").onclick = function () { lightbox(src, false); };
      }
      g.appendChild(f);
    });
    return g;
  }

  function lightbox(src, video) {
    var lb = $("#lightbox");
    var img = $("#lightbox img"), vid = $("#lightbox video");
    if (video) {
      img.style.display = "none";
      img.removeAttribute("src");
      vid.style.display = "";
      vid.src = src;
      vid.play().catch(function () { /* autoplay may be blocked; controls are there */ });
    } else {
      vid.pause();
      vid.removeAttribute("src");
      vid.style.display = "none";
      img.style.display = "";
      img.src = src;
    }
    lb.classList.add("on");
  }
  function closeLightbox() {
    var lb = $("#lightbox");
    if (!lb) return;
    var vid = $("#lightbox video");
    if (vid) { vid.pause(); }
    lb.classList.remove("on");
  }
  document.addEventListener("click", function (e) {
    var lb = $("#lightbox");
    if (!lb || !lb.classList.contains("on") || !e.target.closest("#lightbox")) return;
    // let people scrub / hit play without the click closing the overlay
    if (e.target.closest("#lightbox video")) return;
    closeLightbox();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeLightbox();
  });
})();

</script>
</body>
</html>
